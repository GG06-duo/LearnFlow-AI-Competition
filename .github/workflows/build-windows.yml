name: Build Windows competition package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp_server/learnflow-mcp-server/package-lock.json

      - name: Build MCP server
        shell: pwsh
        run: |
          Push-Location mcp_server/learnflow-mcp-server
          npm ci
          npm run build
          npm prune --omit=dev
          Pop-Location

      - name: Copy portable Node runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging/node | Out-Null
          Copy-Item (Get-Command node).Source packaging/node/node.exe

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --clean packaging/windows.spec

      - name: Create competition ZIP
        shell: pwsh
        run: |
          $package = "44013388作品"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item -Recurse dist/LearnFlow-AI/* $package/
          Compress-Archive -Path $package -DestinationPath "$package.zip" -CompressionLevel Optimal
          $size = (Get-Item "$package.zip").Length
          Write-Host ("ZIP size: {0:N2} MB" -f ($size / 1MB))
          if ($size -gt 1GB) {
            throw "The competition ZIP exceeds the 1 GB upload limit."
          }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: LearnFlow-AI-Windows
          path: 44013388作品.zip
          if-no-files-found: error
          retention-days: 14
